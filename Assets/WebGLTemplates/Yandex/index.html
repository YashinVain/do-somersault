<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <!-- The platform script: gives the game ads, cloud saves and the leaderboard. Without it the game runs offline. -->
  <script src="https://yandex.ru/games/sdk/v2"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1520;
                 touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0d1520; touch-action: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              color: #f4f1ea; font-family: Arial, sans-serif; background: #0d1520; transition: opacity .4s; }
    #loader h1 { margin: 0 0 22px; font-size: 54px; letter-spacing: 2px; }
    #loader .track { width: min(70vw, 420px); height: 6px; background: #223044; border-radius: 3px; overflow: hidden; }
    #loader .fill { width: 0; height: 100%; background: #ee6a55; }

    /* The scenes are wide, so a phone held upright is asked to turn. A big window that happens to be tall is left alone. */
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0d1520; color: #f4f1ea;
              font-family: Arial, sans-serif; text-align: center; flex-direction: column; align-items: center; justify-content: center; }
    #rotate .phone { width: 54px; height: 94px; border: 5px solid #f4f1ea; border-radius: 12px; margin-bottom: 26px;
                     animation: turn 2.4s ease-in-out infinite; }
    #rotate p { margin: 0; font-size: 20px; line-height: 1.4; padding: 0 28px; }
    @keyframes turn { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <h1>НЫРЯЙ</h1>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
  <div id="rotate"><div class="phone"></div><p>Поверни телефон горизонтально,<br>так играть удобнее</p></div>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    // No browser menu on a long press or a right click: the game owns every press.
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // Sharp on phone and retina screens: up to two pixels per CSS pixel.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    // The page keeps a handle on the game for the Yandex bridge (SendMessage from JavaScript).
    createUnityInstance(document.querySelector("#unity-canvas"), config, function (progress) {
      document.getElementById("fill").style.width = (progress * 100) + "%";
    }).then(function (instance) {
      window.unityGame = instance;
      var loader = document.getElementById("loader");
      loader.style.opacity = 0;
      setTimeout(function () { loader.style.display = "none"; }, 450);
    }).catch(function (message) {
      document.getElementById("loader").innerText = message;
    });
  </script>
</body>
</html>
